name: CI

# One workflow checks, tests, and builds every pull request, merge queue entry,
# and push to main, and exports playable Linux, Windows, and macOS clients plus a
# headless Linux dedicated server, so anyone can download a pull request's build
# and play it before it merges. Tags (v*) also publish the builds as a GitHub
# Release. Runners are free for public repositories.
#
# Each build also carries the Shooter launcher (rust/launcher) for every
# platform and a latest.json manifest that describes the build. Every push to
# main publishes them as the rolling `nightly` pre-release, which the launcher
# follows to keep players and servers on the newest build.
#
# The "CI passed" job at the end is the one check branch protection needs: it
# passes only when every other job passed, so jobs can be added, split, or
# renamed without touching the ruleset.
#
# Speed notes (see docs/ci.md):
# - Only runs on main save caches. Pull requests restore main's caches and
#   never evict them.
# - Godot's import cache (godot/.godot) is restored, so the import re-imports
#   only changed assets instead of every asset.
# - Godot tests step the game at a fixed frame rate, as fast as the CPU allows.
# - Pull request and main builds use the `ci` Cargo profile (no LTO); tags use
#   `release`.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A new push to a pull request replaces its old run. Runs on main and tags
  # finish, so main always saves fresh caches and builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  CARGO_PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'ci' }}

jobs:
  # Everything that runs quickly on Linux, in one job so a busy queue has fewer
  # jobs to start. The fastest checks run first.
  checks:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pipx ships with the runner image.
      - name: GDScript lint
        run: pipx run --spec gdtoolkit==4.5.0 gdlint godot/scripts godot/tests
      - name: GDScript format
        run: pipx run --spec gdtoolkit==4.5.0 gdformat --check godot/scripts godot/tests
      # The importer's geometry and material rules are pure Python, so they run
      # without Godot, LFS, or the raw game export.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python importer tests
        run: |
          python -m pip install --quiet "Pillow>=11,<13" "numpy>=2,<3"
          # discover exits 0 when the pattern matches nothing, so fail loudly
          # if the test file is renamed or removed.
          test -f tools/test_import_nuketown.py
          test -f tools/test_import_nuketown_props.py
          python -m unittest discover -s tools -p "test_import_nuketown.py" -v
          python -m unittest discover -s tools -p "test_import_nuketown_props.py" -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        working-directory: rust
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHE }}
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: rust
        run: cargo test --locked

  # The simulation must behave the same on every platform the client and server
  # run on, so its tests also run on Windows and macOS. Every Rust job installs
  # the current stable toolchain rather than using the runner's preinstalled one:
  # that version differs between runner images, and each difference misses the
  # Rust cache.
  rust-test:
    name: Rust tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo test --locked

  # Headless game tests. Every godot/tests/*_test.gd runs; see
  # .github/scripts/godot-tests.sh.
  godot:
    name: Godot tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-pull
        with:
          save: ${{ env.SAVE_CACHE }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHE }}
      - name: Build the GDExtension and the master server
        working-directory: rust
        run: cargo build --locked -p shooter-game -p shooter-master
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - uses: ./.github/actions/godot-import
        with:
          version: ${{ env.GODOT_VERSION }}
          save: ${{ env.SAVE_CACHE }}
      - name: Run Godot tests
        run: .github/scripts/godot-tests.sh

  # Release libraries for the client exports. Merge queue runs skip these and the
  # export: the pull request already built them, and the push to main builds
  # them again.
  lib:
    name: GDExtension (${{ matrix.platform }})
    if: github.event_name != 'merge_group'
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHE }}
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p ../out
          case "${{ matrix.platform }}" in
            linux)
              # The master server ships in the Linux dedicated server zip.
              cargo build --locked --profile "$CARGO_PROFILE" -p shooter-game -p shooter-master -p shooter-launcher
              cp "target/$CARGO_PROFILE/libshooter_game.so" "target/$CARGO_PROFILE/shooter-master" ../out/
              cp "target/$CARGO_PROFILE/shooter-launcher" ../out/shooter-launcher-linux-x86_64
              ;;
            windows)
              cargo build --locked --profile "$CARGO_PROFILE" -p shooter-game -p shooter-launcher
              cp "target/$CARGO_PROFILE/shooter_game.dll" ../out/
              cp "target/$CARGO_PROFILE/shooter-launcher.exe" ../out/shooter-launcher-windows-x86_64.exe
              ;;
            macos)
              # One cargo run builds both architectures in parallel.
              cargo build --locked --profile "$CARGO_PROFILE" -p shooter-game -p shooter-launcher \
                --target aarch64-apple-darwin --target x86_64-apple-darwin
              lipo -create -output ../out/libshooter_game.dylib \
                "target/aarch64-apple-darwin/$CARGO_PROFILE/libshooter_game.dylib" \
                "target/x86_64-apple-darwin/$CARGO_PROFILE/libshooter_game.dylib"
              lipo -create -output ../out/shooter-launcher-macos-universal \
                "target/aarch64-apple-darwin/$CARGO_PROFILE/shooter-launcher" \
                "target/x86_64-apple-darwin/$CARGO_PROFILE/shooter-launcher"
              codesign --force --sign - ../out/shooter-launcher-macos-universal
              ;;
          esac
          ls -l ../out
      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  export:
    name: Export builds
    if: github.event_name != 'merge_group'
    needs: lib
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-pull
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: lib-*
          path: libs
          merge-multiple: true
      - name: Place libraries
        run: |
          set -euo pipefail
          # shooter.gdextension loads target/release for exports. The editor loads
          # the debug entry, so point that at the same Linux build: scenes that
          # use Rust classes must load during import and export.
          mkdir -p rust/target/release rust/target/debug master
          cp libs/libshooter_game.so libs/shooter_game.dll libs/libshooter_game.dylib rust/target/release/
          cp libs/libshooter_game.so rust/target/debug/
          install -m 755 libs/shooter-master master/shooter-master
      - uses: ./.github/actions/godot-import
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Name the build
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "name=shooter-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=shooter-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Export
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          export_preset() {
            local preset="$1" out="$2"
            mkdir -p "$(dirname "$out")"
            godot --headless --path godot --export-release "$preset" "$out"
            test -e "$out"
          }
          export_preset "Linux" "$PWD/builds/linux/shooter.x86_64"
          export_preset "Windows Desktop" "$PWD/builds/windows/shooter.exe"
          # Headless dedicated server: runs as a server on start, no rendering or audio.
          export_preset "Linux Server" "$PWD/builds/server/shooter-server.x86_64"
          cp master/shooter-master builds/server/shooter-master
          mkdir -p dist
          # Zip the three builds while Godot exports macOS.
          pids=()
          (cd builds/linux && zip -qr "../../dist/${NAME}-linux-x86_64.zip" .) & pids+=($!)
          (cd builds/windows && zip -qr "../../dist/${NAME}-windows-x86_64.zip" .) & pids+=($!)
          (cd builds/server && zip -qr "../../dist/${NAME}-server-linux-x86_64.zip" .) & pids+=($!)
          # macOS exports straight to a zipped, ad-hoc signed .app.
          export_preset "macOS" "$PWD/dist/${NAME}-macos-universal.zip"
          for pid in "${pids[@]}"; do wait "$pid"; done
          install -m 755 libs/shooter-launcher-linux-x86_64 libs/shooter-launcher-windows-x86_64.exe \
            libs/shooter-launcher-macos-universal dist/
          ls -lh dist
      - name: Write manifest
        run: .github/scripts/write-manifest.sh dist "${{ steps.meta.outputs.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          # The files are already zips; compressing again only costs time.
          compression-level: 0
      # The launcher follows this release. Runs on main only, never for pull requests.
      - name: Publish nightly
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-nightly.sh dist
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  gate:
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [checks, rust-test, godot, lib, export]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Check every job
        id: result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          # Skipped is fine: merge queue runs skip the library builds and export.
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          fi
      # Temporary, until the "Protect main" ruleset requires only "CI passed":
      # report the job names it requires today, which this workflow no longer
      # has. Delete this step once the ruleset changes.
      - name: Report the ruleset's old check names
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for name in "Rust (fmt, clippy)" "Rust tests (ubuntu-latest)" \
            "Rust tests (windows-latest)" "Rust tests (macos-latest)" \
            "GDScript (lint, format)" "Godot smoke test (headless)" "Export clients"; do
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$name" -f head_sha="$SHA" -f status=completed \
              -f conclusion="$CONCLUSION" -f details_url="$RUN_URL" \
              -f "output[title]=Reported by CI passed" \
              -f "output[summary]=This job now runs inside the CI workflow. See $RUN_URL."
          done
      - name: Require every job to pass
        run: test "${{ steps.result.outputs.conclusion }}" = success
