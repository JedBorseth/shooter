name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-lint:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Public repository, so every runner OS is free. The simulation must behave the
  # same on every platform the client and server run on, so test on all three.
  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked

  # The "Protect main" ruleset requires a check named "Rust (fmt, clippy, test)".
  # Lint and the per-OS tests run as separate jobs, so this job reports that one
  # name and passes only when all of them passed.
  rust:
    name: Rust (fmt, clippy, test)
    if: ${{ always() }}
    needs: [rust-lint, rust-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust job to pass
        env:
          LINT: ${{ needs.rust-lint.result }}
          TEST: ${{ needs.rust-test.result }}
        run: |
          echo "rust-lint: $LINT, rust-test: $TEST"
          test "$LINT" = success && test "$TEST" = success

  gdscript:
    name: GDScript (lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pipx ships with the runner image.
      - run: pipx run --spec gdtoolkit==4.5.0 gdlint godot/scripts godot/tests
      - run: pipx run --spec gdtoolkit==4.5.0 gdformat --check godot/scripts godot/tests

  smoke:
    name: Godot smoke test (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the GDExtension and the master server
        working-directory: rust
        run: cargo build --locked -p shooter-game -p shooter-master
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Import assets
        run: .github/scripts/import-assets.sh
      - name: Run smoke test
        run: godot --headless --path godot --script res://tests/smoke_test.gd
      # Enters Slamcity from the home screen and walks, climbs, and shoots through it.
      - name: Run Slamcity test
        run: godot --headless --path godot --script res://tests/slamcity_test.gd
      - name: Run Nuketown navigation and collision test
        run: godot --headless --path godot --script res://tests/nuketown_test.gd
      - name: Run settings test
        run: godot --headless --path godot --script res://tests/settings_test.gd
      - name: Run secret laser test
        run: godot --headless --path godot --script res://tests/secret_laser_test.gd
      - name: Run Zombies test
        run: godot --headless --path godot --script res://tests/zombies_test.gd
      - name: Run Zombies menu test
        run: godot --headless --path godot --script res://tests/zombies_menu_test.gd
      # Starts a dedicated server process and joins it over UDP on localhost
      # through a simulated lossy, jittery link.
      - name: Run netcode test
        run: godot --headless --path godot --script res://tests/net_test.gd
      # Starts a master server and a dedicated server, finds it on the LAN and
      # Internet tabs of the server browser, and joins it from the list.
      - name: Run server browser test
        run: godot --headless --path godot --script res://tests/server_browser_test.gd
      - name: Run Nuketown server browser test
        run: godot --headless --path godot --script res://tests/server_browser_test.gd -- --nuketown
      - name: Run title screen test
        run: godot --headless --path godot --script res://tests/title_screen_test.gd
      # The benchmark needs a GPU to measure anything; this run only keeps the
      # script, its maps, and every graphics preset loading. See docs/performance.md.
      - name: Run benchmark script (no GPU)
        run: godot --headless --path godot --script res://tests/benchmark.gd
        env:
          BENCH_FRAMES: "10"
