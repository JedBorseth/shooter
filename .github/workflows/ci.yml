name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-lint:
    name: Rust (fmt, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Public repository, so every runner OS is free. The simulation must behave the
  # same on every platform the client and server run on, so test on all three.
  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked

  gdscript:
    name: GDScript (lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # pipx ships with the runner image.
      - run: pipx run --spec gdtoolkit==4.5.0 gdlint godot/scripts godot/tests
      - run: pipx run --spec gdtoolkit==4.5.0 gdformat --check godot/scripts godot/tests

  smoke:
    name: Godot smoke test (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the GDExtension
        working-directory: rust
        run: cargo build --locked -p shooter-game
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Import assets
        run: .github/scripts/import-assets.sh
      - name: Run smoke test
        run: godot --headless --path godot --script res://tests/smoke_test.gd
