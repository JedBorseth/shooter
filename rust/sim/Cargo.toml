[package]
name = "shooter-sim"
description = "Engine-independent, deterministic gameplay simulation shared by client and server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Same version godot-rust already uses, so this adds no new download.
glam = { version = "0.32", features = ["serde"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
