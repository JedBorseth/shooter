[package]
name = "shooter-sim"
description = "Engine-independent, deterministic gameplay simulation shared by client and server."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Same version godot-rust already uses, so this adds no new download.
# `libm`: glam's own float math goes through the same portable library as ours.
glam = { version = "0.32", features = ["serde", "libm"] }
# Bit-identical sin, cos, exp, atan2 on every platform; see `fmath`.
libm = "0.2"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
