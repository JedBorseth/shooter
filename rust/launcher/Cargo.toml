[package]
name = "shooter-launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
indicatif = "0.18.6"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shooter-sim = { version = "0.1.0", path = "../sim" }
ureq = "3.5.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"
