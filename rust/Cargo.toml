[workspace]
resolver = "3"
members = ["sim", "game", "launcher"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Triggered by code that godot-rust's #[class(init)] macro generates.
redundant_field_names = "allow"

# Games need optimized code even in debug builds; dependencies are always fully optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Pull request and main builds: fully optimized, but without the whole-program
# LTO pass and single codegen unit that make release links slow. Tagged
# releases keep the release profile.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
