# Nakama settings for the shooter. Secrets come from compose.yml's flags.
name: shooter
logger:
  level: INFO
session:
  # A session lasts a day; the game refreshes it with the refresh token, which
  # lasts 30 days, so a player stays signed in between launches.
  token_expiry_sec: 86400
  refresh_token_expiry_sec: 2592000
runtime:
  path: /nakama/data/modules
matchmaker:
  # Look for matches every 5 seconds. A ticket first waits for a full match
  # (its max count); after 3 looks (15 seconds) it takes the best match it
  # can, down to its min count, and bots fill the rest of the server.
  interval_sec: 5
  max_intervals: 3
